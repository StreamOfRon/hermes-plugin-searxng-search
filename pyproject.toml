[project]
name = "hermes-plugin-searxng-search"
version = "0.1.0"
description = "SearXNG search tool for Hermes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
